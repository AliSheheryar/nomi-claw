services:
  nomi-claw:
    build: .
    image: nomi-claw:latest
    container_name: nomi-claw
    # NVIDIA GPU access — requires nvidia-container-toolkit on host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Persistent volumes:
    #   - models: HF cache (survives container recreation, ~5-6 GB after first run)
    #   - videos: read-only input clips
    #   - out:    highlight outputs + intermediate JSON
    volumes:
      - ./models:/models
      - ./videos:/videos:ro
      - ./out:/app/out
    # Interactive by default; override with `docker compose run`:
    #   docker compose run --rm nomi-claw python nomi_claw.py /videos/wedding.mp4
    stdin_open: true
    tty: true
    command: ["python", "nomi_claw.py", "--help"]
